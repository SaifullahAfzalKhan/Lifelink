<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = {"darkMode": "class", "theme": {"extend": {"colors": {"surface": "#faf8ff", "inverse-surface": "#283044", "on-error-container": "#93000a", "on-surface-variant": "#5b403d", "on-tertiary-fixed": "#002113", "on-primary-fixed-variant": "#930010", "primary": "#af101a", "on-background": "#131b2e", "secondary": "#6e595a", "primary-container": "#d32f2f", "error": "#ba1a1a", "on-secondary-container": "#745f60", "surface-container-high": "#e2e7ff", "surface-tint": "#ba1a20", "secondary-fixed-dim": "#dbc0c0", "on-error": "#ffffff", "on-primary-container": "#fff2f0", "on-tertiary-fixed-variant": "#005236", "primary-fixed-dim": "#ffb3ac", "on-tertiary": "#ffffff", "outline-variant": "#e4beba", "error-container": "#ffdad6", "on-secondary": "#ffffff", "background": "#faf8ff", "surface-variant": "#dae2fd", "on-secondary-fixed-variant": "#554243", "on-secondary-fixed": "#261818", "tertiary-fixed": "#6ffbbe", "surface-bright": "#faf8ff", "on-tertiary-container": "#d3ffe5", "on-primary-fixed": "#410003", "tertiary-fixed-dim": "#4edea3", "inverse-primary": "#ffb3ac", "inverse-on-surface": "#eef0ff", "secondary-container": "#f8dcdc", "primary-fixed": "#ffdad6", "on-primary": "#ffffff", "secondary-fixed": "#f8dcdc", "on-surface": "#131b2e", "tertiary-container": "#008058", "surface-container": "#eaedff", "surface-container-low": "#f2f3ff", "outline": "#8f6f6c", "tertiary": "#006444", "surface-container-lowest": "#ffffff", "surface-container-highest": "#dae2fd", "surface-dim": "#d2d9f4"}, "borderRadius": {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"}, "spacing": {"space-md": "1rem", "max-width-content": "80rem", "gutter-mobile": "1rem", "space-3xl": "4rem", "space-2xl": "3rem", "space-sm": "0.75rem", "space-xs": "0.5rem", "space-2xs": "0.25rem", "space-lg": "1.5rem", "space-xl": "2rem", "gutter-desktop": "1.5rem", "margin-mobile": "1rem", "margin-tablet": "2rem", "margin-desktop": "3rem"}, "fontFamily": {"label-lg": ["Inter"], "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "body-md": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "label-blood-group": ["Plus Jakarta Sans"], "label-md": ["Inter"], "body-lg": ["Inter"], "body-sm": ["Inter"], "title-md": ["Plus Jakarta Sans"], "display-sm": ["Plus Jakarta Sans"]}, "fontSize": {"label-lg": ["0.875rem", {"lineHeight": "1.25rem", "letterSpacing": "0.01em", "fontWeight": "600"}], "headline-lg-mobile": ["1.5rem", {"lineHeight": "2rem", "letterSpacing": "-0.01em", "fontWeight": "700"}], "headline-sm": ["1.25rem", {"lineHeight": "1.75rem", "fontWeight": "600"}], "display-lg": ["3.5rem", {"lineHeight": "4rem", "letterSpacing": "-0.02em", "fontWeight": "800"}], "headline-lg": ["2rem", {"lineHeight": "2.5rem", "letterSpacing": "-0.01em", "fontWeight": "700"}], "body-md": ["1rem", {"lineHeight": "1.5rem", "fontWeight": "400"}], "headline-md": ["1.5rem", {"lineHeight": "2rem", "letterSpacing": "-0.005em", "fontWeight": "600"}], "label-blood-group": ["1.75rem", {"lineHeight": "2rem", "letterSpacing": "0.02em", "fontWeight": "800"}], "label-md": ["0.75rem", {"lineHeight": "1rem", "letterSpacing": "0.02em", "fontWeight": "600"}], "body-lg": ["1.125rem", {"lineHeight": "1.75rem", "fontWeight": "400"}], "body-sm": ["0.875rem", {"lineHeight": "1.25rem", "fontWeight": "400"}], "title-md": ["1.125rem", {"lineHeight": "1.5rem", "fontWeight": "600"}], "display-sm": ["2.25rem", {"lineHeight": "2.75rem", "letterSpacing": "-0.015em", "fontWeight": "700"}]}}}};</script></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col antialiased pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full max-w-md mx-auto px-4 pb-8 space-y-5">
<!-- Status Bar Simulation -->
<div class="flex items-center justify-between pt-2 pb-1 text-on-surface">
<span class="font-headline-sm text-label-md font-semibold tracking-tight">09:41</span>
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</div>
<!-- Top Bar: Back Action & Trust Pill -->
<div class="flex items-center justify-between">
<button aria-label="Go back" class="w-10 h-10 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-on-surface transition-transform active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="inline-flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-secondary-container text-on-secondary-container">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md tracking-normal">Save lives, spread smiles</span>
</div>
</div>
<!-- Header Section with Emblem -->
<div class="flex flex-col items-center text-center pt-2">
<div class="relative mb-3">
<div class="absolute -inset-2 rounded-full bg-primary-fixed blur-md opacity-60"></div>
<div class="relative w-20 h-20 rounded-2xl bg-surface-container-lowest shadow-md flex items-center justify-center overflow-hidden p-2"><img src="https://lh3.googleusercontent.com/aida/AEtjO1V2PmvnF3Rnj5XF5OBxfvyJZUGJ3CofGvKhNDfu8yiqPyB3LxYIENBVK6TrtdXiEj9T9JYWDnIpm36_MD6X9aMG_hpXjSNRGwZngWDF7K1ss-frB29I_KWlvJEbdLEl0G-4d86wYuJOYWhD-GFZoTLcC2ZR9YqyhlCj4iAroUJoCQloTDZWlcq0yWx0v7YbUnin9xufZCnMzAObOT8JKKYdHGS8lb_FSSTDALzYRsAXo4917S7uTVWLh20" alt="Lifelink Logo" class="w-10 h-10 object-contain block mx-auto"></div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Welcome back</h1>
<p class="font-body-sm text-body-sm text-secondary mt-1">Sign in to continue to your Lifelink account</p>
</div>
<!-- Main Form Card -->
<div class="bg-surface-container-lowest rounded-2xl p-6 shadow-md space-y-4">
<form class="space-y-4" id="loginForm" onsubmit="handleLogin(event)">
<!-- Field 1: Phone or Email -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface" for="identifierInput">Phone or Email</label>
<div class="relative flex items-center rounded-lg bg-surface-container-low transition-all">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full h-12 pl-10 pr-3 bg-transparent rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-secondary focus:outline-none" id="identifierInput" name="identifier" placeholder="e.g. name@example.com or +92 300 1234567" required="" type="text">
</div>
</div>
<!-- Field 2: Password -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="passwordInput">Password</label>
<a class="font-label-md text-label-md text-primary font-semibold hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center rounded-lg bg-surface-container-low transition-all">
<span class="material-symbols-outlined absolute left-3 text-secondary text-[20px] pointer-events-none">lock</span>
<input class="w-full h-12 pl-10 pr-11 bg-transparent rounded-lg font-body-sm text-body-sm text-on-surface placeholder:text-secondary focus:outline-none" id="passwordInput" name="password" placeholder="Enter your password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-2 p-1.5 text-secondary hover:text-on-surface transition-colors flex items-center justify-center" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit CTA Button -->
<div class="pt-1">
<button class="w-full h-12 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-semibold shadow-md flex items-center justify-center space-x-2 transition-transform active:scale-[0.98]" id="submitBtn" type="submit">
<span id="btnText" class="">Login</span>
<span class="hidden material-symbols-outlined text-[20px] animate-spin" id="btnSpinner">progress_activity</span>
</button>
</div>
</form>
<!-- Visual Divider -->
<div class="relative flex items-center justify-center py-1">
<div class="w-full h-px bg-surface-container"></div>
<span class="absolute bg-surface-container-lowest px-3 font-label-md text-label-md text-secondary uppercase tracking-wider">or</span>
</div>
<!-- Alternative Login Action -->
<button class="w-full h-12 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg font-semibold flex items-center justify-center space-x-2 transition-colors active:bg-surface-container" type="button">
<span class="material-symbols-outlined text-[20px] text-primary">smartphone</span>
<span class="">Continue with Phone / OTP</span>
</button>
</div>
<!-- Registration Redirection -->
<div class="text-center pt-1">
<p class="font-body-sm text-body-sm text-secondary">Sign in to continue to your Lifelink account</p>
</div>
<!-- Emergency Protocol Callout -->
<div class="rounded-xl bg-secondary-container p-3.5 flex items-center justify-between shadow-sm">
<div class="flex items-center space-x-2.5">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]">emergency</span>
</div>
<div>
<p class="font-label-md text-label-md font-semibold text-on-surface">Urgent requirement?</p>
<p class="font-body-sm text-body-sm text-secondary">Call Emergency Response 1021</p>
</div>
</div>
<a class="px-3 py-1.5 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold active:scale-95 transition-transform flex items-center space-x-1" href="tel:1021">
<span class="material-symbols-outlined text-[16px]">call</span>
<span class="">Call</span>
</a>
</div>
<!-- Home Indicator -->
<div class="pt-2 flex justify-center">
<div class="w-32 h-1 rounded-full bg-surface-container-highest"></div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('togglePasswordIcon');
    if (!input || !icon) return;
    
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLogin(event) {
    event.preventDefault();
    const btn = document.getElementById('submitBtn');
    const text = document.getElementById('btnText');
    const spinner = document.getElementById('btnSpinner');

    if (!btn || !text || !spinner) return;

    btn.disabled = true;
    text.textContent = 'Verifying credentials...';
    spinner.classList.remove('hidden');

    setTimeout(() => {
      text.textContent = 'Success';
      spinner.classList.add('hidden');
      setTimeout(() => {
        text.textContent = 'Login';
        btn.disabled = false;
      }, 1200);
    }, 1500);
  }
</script></main>





</body></html>
