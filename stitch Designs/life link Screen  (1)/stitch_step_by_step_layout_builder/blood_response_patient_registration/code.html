<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Response - Patient Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#D32F2F',
              'red-hover': '#B71C1C',
              'red-subtle': '#FFF5F5',
              'red-border': '#FED7D7',
              navy: '#0F172A',
              'navy-muted': '#475569',
              'navy-light': '#64748B',
            },
            surface: {
              bg: '#FAF8FF',
              card: '#FFFFFF',
              input: '#F8FAFC',
              border: '#E2E8F0',
            }
          },
          boxShadow: {
            'glow-red': '0 10px 25px -5px rgba(211, 47, 47, 0.25)',
            'card-subtle': '0 4px 20px -2px rgba(15, 23, 42, 0.04)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FAF8FF;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }
    .input-field:focus-within {
      border-color: #D32F2F;
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.12);
    }
  </style>
</head>
<body class="min-h-screen bg-[#FAF8FF] flex justify-center selection:bg-red-100 selection:text-red-700">

  <!-- Mobile Device Container -->
  <main class="w-full max-w-[430px] min-h-screen bg-[#FAF8FF] relative flex flex-col justify-between px-6 py-6 overflow-x-hidden">
    
    <!-- Subtle Ambient Medical Gradient in background -->
    <div class="absolute -top-24 -right-24 w-72 h-72 bg-red-100/50 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-1/3 -left-28 w-60 h-60 bg-blue-50/60 rounded-full blur-2xl pointer-events-none"></div>

    <div class="relative z-10">
      
      <!-- Top Navigation Bar & Security Pill -->
      <header class="flex items-center justify-between pt-1 pb-4">
        <button type="button" aria-label="Go back" class="w-10 h-10 rounded-full bg-white border border-slate-200/80 shadow-sm flex items-center justify-center text-slate-700 hover:bg-slate-50 transition active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
          </svg>
        </button>

        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/90 border border-slate-200/70 shadow-sm">
          <img src="https://lh3.googleusercontent.com/aida/AEtjO1V2PmvnF3Rnj5XF5OBxfvyJZUGJ3CofGvKhNDfu8yiqPyB3LxYIENBVK6TrtdXiEj9T9JYWDnIpm36_MD6X9aMG_hpXjSNRGwZngWDF7K1ss-frB29I_KWlvJEbdLEl0G-4d86wYuJOYWhD-GFZoTLcC2ZR9YqyhlCj4iAroUJoCQloTDZWlcq0yWx0v7YbUnin9xufZCnMzAObOT8JKKYdHGS8lb_FSSTDALzYRsAXo4917S7uTVWLh20" alt="Lifelink Logo" class="w-5 h-5 object-contain inline-block mr-1.5">
          <span class="text-[11px] font-bold tracking-wider text-slate-800 uppercase">Lifelink Healthcare Network • Save Lives. Spread Smiles</span>
        </div>

        <div class="w-10 h-10 rounded-full flex items-center justify-center text-slate-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"></path>
          </svg>
        </div>
      </header>

      <!-- Brand Emblem & Title Section -->
      <div class="mt-3 flex flex-col items-center text-center">
        <!-- Logo Icon badge with heartbeat pulse -->
        <div class="relative flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-red-500/10 via-red-50 to-white border border-red-200/80 shadow-sm mb-3"><img src="https://lh3.googleusercontent.com/aida/AEtjO1V2PmvnF3Rnj5XF5OBxfvyJZUGJ3CofGvKhNDfu8yiqPyB3LxYIENBVK6TrtdXiEj9T9JYWDnIpm36_MD6X9aMG_hpXjSNRGwZngWDF7K1ss-frB29I_KWlvJEbdLEl0G-4d86wYuJOYWhD-GFZoTLcC2ZR9YqyhlCj4iAroUJoCQloTDZWlcq0yWx0v7YbUnin9xufZCnMzAObOT8JKKYdHGS8lb_FSSTDALzYRsAXo4917S7uTVWLh20" alt="Lifelink Brand Logo" class="w-12 h-12 object-contain"></div>

        <h1 class="text-2xl font-extrabold text-[#0F172A] tracking-tight">Create your account</h1>
        <p class="text-[13px] font-medium text-slate-500 mt-1 max-w-[280px]">
          Tell us a few details to get started with emergency blood response.
        </p>
      </div>

      <!-- Registration Form Container -->
      <form class="mt-6 space-y-3.5" onsubmit="event.preventDefault()">
        
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 ml-1">Full Name</label>
          <div class="input-field relative flex items-center rounded-xl bg-white border border-slate-200 px-3.5 py-3 transition shadow-sm">
            <svg class="w-5 h-5 text-slate-400 mr-2.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
            </svg>
            <input type="text" placeholder="e.g. Tariq Mehmood" class="w-full bg-transparent text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none" required="">
          </div>
        </div>

        <!-- Phone Number -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 ml-1">Phone Number</label>
          <div class="input-field relative flex items-center rounded-xl bg-white border border-slate-200 px-3.5 py-3 transition shadow-sm">
            <span class="text-xs font-bold text-slate-600 mr-2 pr-2 border-r border-slate-200 flex items-center gap-1">
              🇵🇰 +92
            </span>
            <input type="tel" placeholder="300 1234567" class="w-full bg-transparent text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none tracking-wide" required="">
            <svg class="w-4 h-4 text-emerald-500 ml-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
            </svg>
          </div>
        </div>

        <!-- Email Address (Optional) -->
        <div>
          <div class="flex items-center justify-between mb-1.5 ml-1">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-700">Email Address</label>
            <span class="text-[11px] font-medium text-slate-400">Optional</span>
          </div>
          <div class="input-field relative flex items-center rounded-xl bg-white border border-slate-200 px-3.5 py-3 transition shadow-sm">
            <svg class="w-5 h-5 text-slate-400 mr-2.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"></path>
            </svg>
            <input type="email" placeholder="name@example.com" class="w-full bg-transparent text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none">
          </div>
        </div>

        <!-- City / Location -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 ml-1">City / Location</label>
          <div class="input-field relative flex items-center rounded-xl bg-white border border-slate-200 px-3.5 py-3 transition shadow-sm">
            <svg class="w-5 h-5 text-[#D32F2F] mr-2.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"></path>
            </svg>
            <input type="text" placeholder="e.g. Lahore, Punjab" class="w-full bg-transparent text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none" required="">
            <button type="button" class="text-[11px] font-bold text-[#D32F2F] bg-red-50 hover:bg-red-100 px-2 py-1 rounded-md transition flex items-center gap-1">
              GPS
            </button>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 ml-1">Password</label>
          <div class="input-field relative flex items-center rounded-xl bg-white border border-slate-200 px-3.5 py-3 transition shadow-sm">
            <svg class="w-5 h-5 text-slate-400 mr-2.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"></path>
            </svg>
            <input id="pwdInput" type="password" placeholder="Minimum 8 characters" class="w-full bg-transparent text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none" required="">
            <button type="button" onclick="const p = document.getElementById('pwdInput'); p.type = p.type === 'password' ? 'text' : 'password';" class="text-slate-400 hover:text-slate-600 ml-2 focus:outline-none">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5 ml-1">Confirm Password</label>
          <div class="input-field relative flex items-center rounded-xl bg-white border border-slate-200 px-3.5 py-3 transition shadow-sm">
            <svg class="w-5 h-5 text-slate-400 mr-2.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <input type="password" placeholder="Re-enter password" class="w-full bg-transparent text-sm font-medium text-slate-900 placeholder:text-slate-400 outline-none" required="">
          </div>
        </div>

        <!-- Terms & Privacy Checkbox -->
        <div class="pt-1">
          <label class="flex items-start gap-3 cursor-pointer select-none">
            <input type="checkbox" class="mt-1 w-4 h-4 rounded border-slate-300 text-[#D32F2F] focus:ring-[#D32F2F] accent-[#D32F2F] transition cursor-pointer" checked="">
            <span class="text-xs text-slate-600 leading-snug">
              I agree to the <a href="#" class="text-[#D32F2F] font-semibold hover:underline">Terms of Service</a> &amp; <a href="#" class="text-[#D32F2F] font-semibold hover:underline">Privacy Policy</a>
            </span>
          </label>
        </div>

        <!-- Create Account Primary CTA -->
        <div class="pt-3">
          <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-[#D32F2F] hover:bg-[#B71C1C] active:scale-[0.98] text-white font-bold text-sm shadow-glow-red flex items-center justify-center gap-2 transition duration-150">
            <span class="">Create Account</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
            </svg>
          </button>
        </div>

      </form>

      <!-- Bottom Sign In link -->
      <div class="mt-6 mb-2 text-center">
        <p class="text-xs text-slate-600 font-medium">
          Already have an account? 
          <a href="#" class="font-bold text-[#D32F2F] hover:underline ml-1">Sign In</a>
        </p>
      </div>

    </div>

    <!-- Micro emergency reassurance footer badge -->
    <div class="relative z-10 pt-4 pb-2 border-t border-slate-200/60 mt-4 flex items-center justify-center gap-2 text-slate-400 text-[11px]">
      <svg class="w-3.5 h-3.5 text-slate-400" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
      </svg>
      <span class="">256-Bit Encrypted Healthcare Network</span>
    </div>

  </main>







</body></html>
