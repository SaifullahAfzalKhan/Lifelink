<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_4 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_4" style="display:block;"><svg class="w-full h-full" fill="none" viewBox="0 0 360 280" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient cx="50%" cy="50%" id="netGlow" r="50%">
<stop offset="0%" stop-color="#fee2e2" stop-opacity="0.8"></stop>
<stop offset="60%" stop-color="#fef2f2" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
</radialGradient>
<linearGradient id="primaryDropGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ef4444"></stop>
<stop offset="60%" stop-color="#dc2626"></stop>
<stop offset="100%" stop-color="#991b1b"></stop>
</linearGradient>
<filter height="140%" id="shadowRed" width="140%" x="-20%" y="-20%">
<feDropShadow dx="0" dy="6" flood-color="#dc2626" flood-opacity="0.3" stdDeviation="8"></feDropShadow>
</filter>
</defs>
<!-- Ambient Glow -->
<circle cx="180" cy="140" fill="url(#netGlow)" r="130"></circle>
<!-- Network Connecting Lines with subtle pulses -->
<g stroke="#cbd5e1" stroke-dasharray="4 4" stroke-width="1.5">
<line opacity="0.6" x1="180" x2="80" y1="140" y2="70">
<animate attributeName="stroke-dashoffset" dur="3s" repeatCount="indefinite" values="16;0"></animate>
</line>
<line opacity="0.6" x1="180" x2="280" y1="140" y2="80">
<animate attributeName="stroke-dashoffset" dur="3.5s" repeatCount="indefinite" values="0;16"></animate>
</line>
<line opacity="0.6" x1="180" x2="60" y1="140" y2="190">
<animate attributeName="stroke-dashoffset" dur="2.8s" repeatCount="indefinite" values="16;0"></animate>
</line>
<line opacity="0.6" x1="180" x2="290" y1="140" y2="200">
<animate attributeName="stroke-dashoffset" dur="3.2s" repeatCount="indefinite" values="0;16"></animate>
</line>
<line opacity="0.6" x1="180" x2="180" y1="140" y2="235">
<animate attributeName="stroke-dashoffset" dur="2.5s" repeatCount="indefinite" values="16;0"></animate>
</line>
<line opacity="0.3" x1="80" x2="60" y1="70" y2="190"></line>
<line opacity="0.3" x1="280" x2="290" y1="80" y2="200"></line>
</g>
<!-- Radar Wave from Center -->
<circle cx="180" cy="140" fill="none" opacity="0" r="45" stroke="#ef4444" stroke-width="1.5">
<animate attributeName="r" dur="3s" repeatCount="indefinite" values="40;110"></animate>
<animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.6;0"></animate>
</circle>
<!-- Satellite Nodes (Blood Bank, Donor, Hospital) -->
<!-- Top-Left: Donor Node -->
<g transform="translate(80, 70)">
<circle cx="0" cy="0" fill="#ffffff" filter="url(#shadowRed)" r="18" stroke="#e2e8f0" stroke-width="1.5"></circle>
<circle cx="0" cy="0" fill="#fef2f2" r="14"></circle>
<path d="M-4 3c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="#dc2626" stroke-linecap="round" stroke-width="1.5"></path>
<circle cx="0" cy="-3" fill="#dc2626" r="2.5"></circle>
<!-- Status badge -->
<circle cx="12" cy="-12" fill="#16a34a" r="4"></circle>
</g>
<!-- Top-Right: Hospital Node -->
<g transform="translate(280, 80)">
<circle cx="0" cy="0" fill="#ffffff" filter="url(#shadowRed)" r="18" stroke="#e2e8f0" stroke-width="1.5"></circle>
<circle cx="0" cy="0" fill="#eff6ff" r="14"></circle>
<!-- Medical Cross -->
<path d="M0 -5v10M-5 0h10" stroke="#2563eb" stroke-linecap="round" stroke-width="2"></path>
<circle cx="12" cy="-12" fill="#2563eb" r="4"></circle>
</g>
<!-- Bottom-Left: Blood Bank Node -->
<g transform="translate(60, 190)">
<circle cx="0" cy="0" fill="#ffffff" r="16" stroke="#e2e8f0" stroke-width="1.5"></circle>
<circle cx="0" cy="0" fill="#fff7ed" r="12"></circle>
<!-- Blood Pack / Droplet -->
<path d="M0 -4c-2 2.5-3.5 4.5-3.5 6.5a3.5 3.5 0 0 0 7 0C3.5 2.5 2 .5 0 -4Z" fill="#ea580c"></path>
<circle cx="11" cy="-11" fill="#ea580c" r="3.5"></circle>
</g>
<!-- Bottom-Right: Fast Response Ambulance/Emergency Node -->
<g transform="translate(290, 200)">
<circle cx="0" cy="0" fill="#ffffff" r="16" stroke="#e2e8f0" stroke-width="1.5"></circle>
<circle cx="0" cy="0" fill="#f0fdf4" r="12"></circle>
<path d="M-4 1h8M-1 -3l-3 4h4l-1 4" stroke="#16a34a" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
<circle cx="11" cy="-11" fill="#16a34a" r="3.5"></circle>
</g>
<!-- Bottom-Center: Verified Pulse Dot -->
<g transform="translate(180, 235)">
<circle cx="0" cy="0" fill="#ffffff" r="10" stroke="#e2e8f0"></circle>
<circle cx="0" cy="0" fill="#dc2626" r="5">
<animate attributeName="r" dur="2s" repeatCount="indefinite" values="4;6;4"></animate>
</circle>
</g>
<!-- Central Focal Node: Vibrant Blood Drop & Pulse Hub -->
<g transform="translate(180, 140)">
<circle cx="0" cy="0" fill="#ffffff" filter="url(#shadowRed)" r="38"></circle>
<circle cx="0" cy="0" fill="url(#primaryDropGrad)" r="32"></circle>
<!-- Inner Drop Highlight -->
<path d="M-8 -6C-12 2 -14 10 -10 16" opacity="0.5" stroke="#ffffff" stroke-linecap="round" stroke-width="2"></path>
<!-- Center Lifeline ECG Pulse -->
<path d="M-13 6h6l2.5-7 5 13 4-9 2.5 3h6" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_4 -->


</body></html>
