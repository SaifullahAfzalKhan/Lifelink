<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Response - Splash Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#D32F2F',
              redLight: '#FEE2E2',
              redDark: '#991B1B',
              navy: '#0F172A',
              navyLight: '#1E293B',
              slate: '#64748B',
              bgLight: '#FAFAFC',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.28;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.48;
      }
    }
    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-5px) scale(1.02);
      }
    }
    @keyframes ecgLine {
      0% {
        stroke-dashoffset: 160;
      }
      50% {
        stroke-dashoffset: 0;
      }
      100% {
        stroke-dashoffset: -160;
      }
    }
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .animate-logo-float {
      animation: logoFloat 3.6s ease-in-out infinite;
    }
    .animate-fade-in {
      animation: fadeInSlide 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .ecg-path {
      stroke-dasharray: 160;
      animation: ecgLine 2.2s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 m-0 font-sans antialiased selection:bg-red-500 selection:text-white">

  <!-- Mobile Frame Container (390px x 844px iPhone standard layout) -->
  <div class="relative w-full max-w-[390px] h-[844px] bg-[#FAFAFC] overflow-hidden flex flex-col justify-between shadow-2xl rounded-[40px] border-[8px] border-slate-900/90 select-none">
    
    <!-- Background Subtle Decorative Medical Grid & Ambient Soft Red Glow -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
      <!-- Soft Radial Light Gradients -->
      <div class="absolute -top-32 -left-20 w-80 h-80 bg-red-100/50 rounded-full blur-3xl"></div>
      <div class="absolute top-1/3 -right-24 w-72 h-72 bg-red-50/70 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-20 left-10 w-72 h-72 bg-slate-100/80 rounded-full blur-3xl"></div>

      <!-- Fine Precision Geometric Medical Plus Accents -->
      <div class="absolute top-16 right-8 text-red-200/50 font-mono text-xs select-none">＋</div>
      <div class="absolute top-44 left-10 text-slate-300/60 font-mono text-xs select-none">＋</div>
      <div class="absolute bottom-40 right-12 text-slate-300/60 font-mono text-xs select-none">＋</div>
      <div class="absolute bottom-60 left-8 text-red-200/40 font-mono text-xs select-none">＋</div>
    </div>

    <!-- Top Status Bar Area -->
    <header class="relative z-10 pt-4 px-7 flex justify-between items-center text-slate-800 text-xs font-semibold">
      <span class="tracking-tight">9:41</span>
      <div class="flex items-center space-x-1.5">
        <!-- Cellular Bars -->
        <div class="flex items-end space-x-0.5 h-2.5">
          <span class="w-0.5 h-1 bg-slate-800 rounded-sm"></span>
          <span class="w-0.5 h-1.5 bg-slate-800 rounded-sm"></span>
          <span class="w-0.5 h-2 bg-slate-800 rounded-sm"></span>
          <span class="w-0.5 h-2.5 bg-slate-800 rounded-sm"></span>
        </div>
        <!-- Wifi Icon -->
        <svg class="w-3.5 h-3.5 fill-current text-slate-800 ml-0.5" viewBox="0 0 24 24">
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.2c3.55 0 6.77 1.34 9.24 3.56L12 19.34 2.76 10.76C5.23 8.54 8.45 7.2 12 7.2z"></path>
        </svg>
        <!-- Battery Icon -->
        <div class="w-5 h-2.5 border border-slate-800 rounded-[3px] p-0.5 flex items-center">
          <div class="w-3 h-1.5 bg-slate-800 rounded-[1px]"></div>
        </div>
      </div>
    </header>

    <!-- Center Hero Branding Content -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-8 text-center -mt-6">
      
      <!-- Animated Logo Container with Layered Emergency Pulsing Beacon -->
      <div class="relative flex items-center justify-center mb-7">
        <!-- Ambient Blood Red Soft Outer Glow Ring -->
        <div class="absolute w-36 h-36 rounded-full bg-red-400/25 blur-xl animate-pulse-glow"></div>
        <div class="absolute w-28 h-28 rounded-full bg-red-500/20 blur-md"></div>
        
        <!-- Clean Medical Emblem Badge Base -->
        <div class="relative w-28 h-28 rounded-3xl bg-white shadow-xl shadow-red-500/10 border border-red-100 flex items-center justify-center animate-logo-float transition-all duration-300">
          <!-- Official Blood Response Brand Vector Asset -->
          <img src="https://lh3.googleusercontent.com/aida/AEtjO1V2PmvnF3Rnj5XF5OBxfvyJZUGJ3CofGvKhNDfu8yiqPyB3LxYIENBVK6TrtdXiEj9T9JYWDnIpm36_MD6X9aMG_hpXjSNRGwZngWDF7K1ss-frB29I_KWlvJEbdLEl0G-4d86wYuJOYWhD-GFZoTLcC2ZR9YqyhlCj4iAroUJoCQloTDZWlcq0yWx0v7YbUnin9xufZCnMzAObOT8JKKYdHGS8lb_FSSTDALzYRsAXo4917S7uTVWLh20" alt="Lifelink Brand Logo" class="w-16 h-16 object-contain">
        </div>
      </div>

      <!-- App Title & Brand Hierarchy -->
      <div class="animate-fade-in space-y-2">
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center justify-center gap-1.5">
          <span class="">Lifelink</span>
        </h1>
        
        <!-- Subtitle Pill / Badge -->
        <div class="inline-flex items-center gap-1.5 px-3.5 py-1 bg-red-50 border border-red-200/60 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-ping"></span>
          <p class="text-xs font-semibold text-red-700 tracking-wide">Save lives, spread smiles</p>
        </div>

        <p class="text-[13px] text-slate-500 font-medium pt-1 max-w-[250px] mx-auto leading-relaxed">
          Immediate life-saving blood mobilization &amp; donor dispatch system
        </p>
      </div>

    </main>

    <!-- Bottom Loading Indicator & Security Watermark Area (No Interactive Buttons) -->
    <footer class="relative z-10 pb-9 px-8 flex flex-col items-center space-y-4">
      
      <!-- Subtle Heartbeat / ECG Loading Pulse -->
      <div class="flex flex-col items-center space-y-2.5">
        <div class="w-24 h-6 flex items-center justify-center">
          <svg class="w-20 h-5" viewBox="0 0 100 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Background Track -->
            <path d="M0 12H30L36 5L42 19L48 8L53 15L57 12H100" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <!-- Animated Glowing Pulse Wave -->
            <path class="ecg-path" d="M0 12H30L36 5L42 19L48 8L53 15L57 12H100" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>

        <!-- Subtle Loading Dots & Status Text -->
        <div class="flex items-center space-x-2">
          <div class="flex space-x-1">
            <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-bounce" style="animation-delay: 0s"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-bounce" style="animation-delay: 0.15s"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-red-600 animate-bounce" style="animation-delay: 0.3s"></span>
          </div>
          <span class="text-[11px] font-semibold text-slate-400 tracking-wider uppercase">Connecting Network</span>
        </div>
      </div>

      <!-- Trust Badging & Al-Khidmat Foundation Tag -->
      <div class="pt-2 text-center">
        <span class="text-[10px] text-slate-400 font-medium tracking-wide">
          Secured Healthcare Emergency Protocol • v2.4
        </span>
      </div>

      <!-- iOS Home Indicator Bar -->
      <div class="w-32 h-1 bg-slate-300/80 rounded-full mx-auto mt-2"></div>
    </footer>

  </div>








</body></html>
