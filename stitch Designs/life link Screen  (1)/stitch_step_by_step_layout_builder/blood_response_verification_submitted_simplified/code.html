<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col antialiased pt-safe pb-safe selection:bg-primary-container selection:text-on-primary-container">
<main class="flex-1 flex flex-col justify-between w-full px-5 py-3">
<!-- Top Section -->
<div class="flex flex-col w-full space-y-7">
<!-- Top Navigation & Brand Header -->
<div class="flex items-center justify-between pt-1">
<button aria-label="Go Back" class="w-10 h-10 rounded-full bg-surface-container-high/60 flex items-center justify-center text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<!-- Central Brand Pill with Pulsing Live Beacon -->
<div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-surface-container-high shadow-sm">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<span class="font-label-md text-label-md text-on-surface tracking-wider uppercase font-semibold">LIFELINK RESPONSE</span>
</div>
<!-- Security Verified Badge -->
<div class="w-10 h-10 rounded-full bg-surface-container-high/60 flex items-center justify-center text-tertiary" title="Secure Medical Gate">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
</div>
</div>
<!-- Icon & Clean Typography Header -->
<div class="flex flex-col items-center text-center pt-3 px-2">
<!-- Soft rounded-2xl square with rose/red gradient tint -->
<div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-fixed/60 to-secondary-container/80 border border-primary-fixed flex items-center justify-center shadow-sm mb-5">
<div class="w-12 h-12 rounded-xl bg-white/90 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[30px] text-tertiary" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold tracking-tight">Verification Submitted</h1>
<p class="font-body-md text-body-md text-secondary mt-2 max-w-xs leading-relaxed">
          Your organization details have been received and are under review. We will notify you once approved.
        </p>
</div>
<!-- Single Minimal Summary Card -->
<div class="bg-surface-container-lowest rounded-2xl p-5 border border-surface-container-high/80 shadow-sm space-y-4">
<!-- Reference ID Row -->
<div class="flex items-center justify-between pb-3.5 border-b border-surface-container-high/60">
<span class="font-label-md text-label-md text-secondary uppercase tracking-wider font-semibold">Reference ID</span>
<div class="flex items-center gap-1.5">
<span class="font-title-md text-title-md text-on-surface font-bold tracking-tight" id="ref-id">#BR-ORG-84920</span>
<button aria-label="Copy Reference ID" class="p-1 rounded-md text-secondary hover:text-primary active:scale-90 transition-transform" id="copy-btn" onclick="copyRefId()" type="button">
<span class="material-symbols-outlined text-[18px]" id="copy-icon">content_copy</span>
</button>
</div>
</div>
<!-- Status Row -->
<div class="flex items-center justify-between pb-3.5 border-b border-surface-container-high/60">
<span class="font-label-md text-label-md text-secondary uppercase tracking-wider font-semibold">Status</span>
<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md font-semibold">
<span class="material-symbols-outlined text-[14px]">schedule</span>
            Under Review
          </span>
</div>
<!-- Review Time Row -->
<div class="flex items-center justify-between pt-0.5">
<span class="font-label-md text-label-md text-secondary uppercase tracking-wider font-semibold">Review Time</span>
<span class="font-label-lg text-label-lg text-tertiary font-semibold">Estimated 24–48 hours</span>
</div>
</div>
</div>
<!-- Bottom Actions & Footer -->
<div class="flex flex-col items-center gap-3 pt-8 pb-3 w-full">
<button class="w-full py-4 px-6 rounded-xl bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 shadow-sm transition-all" type="button">
<span class="">Back to Home</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Security & Trust Badge Footer -->
<div class="flex items-center justify-center gap-1.5 pt-2">
<span class="material-symbols-outlined text-[16px] text-tertiary" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-md text-label-md text-secondary uppercase tracking-wider font-medium">256-Bit Encrypted Healthcare Network</span>
</div>
</div>
</main>
<script>
    function copyRefId() {
      const text = document.getElementById('ref-id').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const icon = document.getElementById('copy-icon');
        icon.innerText = 'done';
        setTimeout(() => {
          icon.innerText = 'content_copy';
        }, 2000);
      }).catch(() => {
        const icon = document.getElementById('copy-icon');
        icon.innerText = 'done';
        setTimeout(() => {
          icon.innerText = 'content_copy';
        }, 2000);
      });
    }
  </script>


</body></html>
